name: Publish to NPM

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    concurrency: ${{ github.workflow }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Cache turborepo output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules/.cache/turbo
            packages/*/.turbo
          key: ${{ runner.os }}-publish-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Publish to npm
        run: |
          set -e
          for dir in packages/*/; do
            pkg="$dir/package.json"
            [ -f "$pkg" ] || continue

            private=$(node -pe "require('./$pkg').private || false")
            [ "$private" = "true" ] && continue

            name=$(node -pe "require('./$pkg').name")
            version=$(node -pe "require('./$pkg').version")

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
              continue
            fi

            echo "Publishing $name@$version"
            pnpm publish "$dir" --access public --no-git-checks --provenance
          done
